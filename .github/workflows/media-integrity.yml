name: DemonFruitzDex media integrity

on:
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "data/**"
      - "reports/catalogue-media-gap-v49*.json"
      - "scripts/check_v49*.py"
      - ".github/workflows/media-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "index.html"
      - "data/**"
      - "reports/catalogue-media-gap-v49*.json"
      - "scripts/check_v49*.py"
      - ".github/workflows/media-integrity.yml"

jobs:
  media-validation:
    name: Media links and catalogue safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript parsing
        run: |
          node --check app.js
          node --check data/clips.js
      - name: Validate catalogue, provenance and no-full-episodes policy
        run: |
          python scripts/validate_clips.py
          python scripts/check_v45.py
          python scripts/check_v46.py
          python scripts/check_v48.py
          python scripts/check_v49.py
          python scripts/check_v49a.py
          python scripts/check_v49b.py
