name: DemonFruitzDex media integrity
# V4.9.c4 frames the manuscript while retaining the catalogue safety gates.

on:
  pull_request:
    paths:
      - "app.js"
      - "styles.css"
      - "index.html"
      - "clip-check.html"
      - "media-check.html"
      - "assets/css/**"
      - "assets/bg/**"
      - "data/**"
      - "reports/catalogue-media-gap-v49*.json"
      - "scripts/check_v49*.py"
      - "scripts/capture_parchment_preview.py"
      - ".github/workflows/media-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "styles.css"
      - "index.html"
      - "clip-check.html"
      - "media-check.html"
      - "assets/css/**"
      - "assets/bg/**"
      - "data/**"
      - "reports/catalogue-media-gap-v49*.json"
      - "scripts/check_v49*.py"
      - "scripts/capture_parchment_preview.py"
      - ".github/workflows/media-integrity.yml"

jobs:
  media-validation:
    name: Media links and catalogue safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript parsing
        run: |
          node --check app.js
          node --check data/clips.js
      - name: Validate catalogue, provenance and no-full-episodes policy
        run: |
          python scripts/validate_clips.py
          python scripts/check_v45.py
          python scripts/check_v46.py
          python scripts/check_v47.py
          python scripts/check_v48.py
          python scripts/check_v49.py
          python scripts/check_v49a.py
          python scripts/check_v49b.py
          python scripts/check_v49b2.py
          python scripts/check_v49b3.py

      - name: Verify manuscript borders and capture five Chrome viewports
        run: |
          python -m pip install --quiet playwright
          python scripts/capture_parchment_preview.py

      - name: Upload V4.9.c4 review preview
        uses: actions/upload-artifact@v4
        with:
          name: DemonFruitzDex-V49c4-preview
          retention-days: 7
          if-no-files-found: error
          path: |
            index.html
            app.js
            styles.css
            clip-check.html
            media-check.html
            data/*.js
            assets/**
            reports/v49c-parchment-theme-review.md
            reports/screenshots/v49c/**
            reports/screenshots/v49c4/**
            PREVIEW-README.txt
